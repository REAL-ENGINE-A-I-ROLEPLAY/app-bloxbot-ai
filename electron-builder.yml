appId: ai.arerps.bloxbot.desktop
productName: A.R.E.R.P.S + BloxBot A.I.
directories:
  output: release
files:
  - dist/**
  - dist-electron/**
  - package.json
  - "!node_modules/**"
npmRebuild: false
asar: true
mac:
  category: public.app-category.developer-tools
  icon: electron/icons/icon.icns
  hardenedRuntime: true
  artifactName: A.R.E.R.P.S-Plus-BloxBot-A.I.-${version}-mac.${ext}
  target:
    - dmg
    - zip
win:
  icon: electron/icons/icon.ico
  artifactName: A.R.E.R.P.S-Plus-BloxBot-A.I.-Setup-${version}.${ext}
  target:
    - nsis
linux:
  category: Development
  icon: electron/icons/icon.png
  artifactName: A.R.E.R.P.S-Plus-BloxBot-A.I.-${version}-linux-amd64.${ext}
  target:
    - deb
publish:
  provider: github
  owner: paralov
  repo: app-bloxbot-ai
